<!DOCTYPE html>
<html>
    <head>
        <title>GitHub page Layout</title>
        <link rel="icon" type="image/x-icon" href="images/GitHub favicon.png">
        <meta name="description" content="Layout for gitHUb web page">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">   
        <link rel="stylesheet" href="style_GitHub.css">

    </head>
    <body>
        <div class="outer_container">
            <div id="firstBlock">
               <div id="logoSection"><img src="images/GitHub Logo.png" alt="GitHub logo" height="60px" width="40px"></div>
               <div id="titleSection"><p>GITHUB</p></div>
            </div>

            <div id="inner_container">
                <div id="firstColumn">
                    
                    <div id="leftBox">
                    </div>

                </div>
    
                <div id="secondColumn">
                    <div id="rightBox">

                        <div id="firstRow">
                            <input type="search" name="search" id="search" placeholder="Search">
                        </div>

                        <div id="middleRow">
                            <div id="mchild1"></div>
                            <div id="mchild2"></div>
                            <div id="mchild3"></div>
                        </div>

                        <div id="lastRow">
                            <div id="lchild">  </div>
                        </div>
                           
                    </div>
                </div>
            </div>

           

        </div>
    </body>
</html>
